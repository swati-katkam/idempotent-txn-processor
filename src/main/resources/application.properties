# Background worker
worker.batchSize=50
worker.idlePollMillis=200

# Retry: maxAttempts counts the first attempt too (3 = 1 try + 2 retries)
retry.maxAttempts=3
retry.initialBackoffMillis=100
retry.multiplier=2.0
retry.maxBackoffMillis=2000

# Ordering (sequence-based)
#   GLOBAL  = one sequence for the whole stream (matches the assessment test data)
#   ACCOUNT = independent sequence per account
ordering.scope=GLOBAL
ordering.firstSequence=1
# A record that fails validation but has a readable sequence number frees its slot,
# so a single poison record cannot block the partition.
ordering.rejectedRecordsReleaseSequence=true

# Validation
validation.maxAmount=1000000

# Fault simulation (demo only). TXN-2005 fails once with a transient error, then succeeds on retry.
# Format: TXN-ID:COUNT[:BEFORE_COMMIT|AFTER_COMMIT], comma separated. Override with --fault / --no-faults.
simulation.faults=TXN-2005:1:BEFORE_COMMIT
